name: 마감 임박 알림

# 앱은 Streamlit Cloud에 있고 거기엔 스케줄러가 없다. PC를 켜두지 않아도
# 알림이 가도록 GitHub Actions에서 매일 돌린다.
on:
  schedule:
    # UTC 기준이라 00:00 UTC = 한국시간 오전 9시
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 이내 마감을 알릴지"
        required: false
        default: "3"
      dry_run:
        description: "보내지 않고 내용만 확인"
        type: boolean
        required: false
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 설정 확인
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          # 보관함이 외부 DB에 있어야 읽을 수 있다. SQLite는 이 러너에 없다.
          if [ -z "$DATABASE_URL" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL 시크릿이 없어 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에서 추가하세요."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$SMTP_USER" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::발송 채널(TELEGRAM_BOT_TOKEN 또는 SMTP_USER)이 없어 건너뜁니다."
            exit 0
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: 마감 임박 공고 알림
        if: steps.check.outputs.ready == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python notify.py \
            --days "${{ github.event.inputs.days || '3' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
